name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for NuGet Trusted Publishing (no long-lived secret)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet build Crap4CSharp.sln

      - run: dotnet test Crap4CSharp.sln --no-build

      - run: dotnet pack src/Crap4CSharp/Crap4CSharp.csproj -c Release -p:Version=${GITHUB_REF_NAME#v} -o ./nupkg

      - name: NuGet login (OIDC, short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
