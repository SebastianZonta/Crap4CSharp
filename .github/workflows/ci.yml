name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore Crap4CSharp.sln

      - run: dotnet format whitespace Crap4CSharp.sln --verify-no-changes --no-restore

      - run: dotnet build Crap4CSharp.sln -c Release --no-restore

      - run: dotnet test Crap4CSharp.sln -c Release --no-build
