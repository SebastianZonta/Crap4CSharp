name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore Crap4CSharp.sln

      - run: dotnet format whitespace Crap4CSharp.sln --verify-no-changes --no-restore

      - run: dotnet build Crap4CSharp.sln -c Release --no-restore

      - run: dotnet test Crap4CSharp.sln -c Release --no-build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - run: dotnet pack src/Crap4CSharp/Crap4CSharp.csproj -c Release -p:Version=0.0.0-e2e -o ./nupkg

      - run: dotnet tool install -g crap4csharp --add-source ./nupkg --version 0.0.0-e2e

      - run: bash e2e/matrix.sh

  publish:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      id-token: write # OIDC for NuGet Trusted Publishing (no long-lived secret)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet pack src/Crap4CSharp/Crap4CSharp.csproj -c Release -p:Version=${GITHUB_REF_NAME#v} -o ./nupkg

      - name: NuGet login (OIDC, short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
